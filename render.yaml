# Render Blueprint for the current JSON-backed storefront and API.
# Set the three public URLs during Blueprint creation; see docs/runbooks/deployment.md.
services:
  - type: web
    name: furniro-api
    runtime: node
    rootDir: Backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: furniro-storefront
    runtime: static
    # The sitemap imports Backend data, so this build needs the whole repository.
    buildCommand: cd Frontend && npm ci && npm run deploy:check && npm run build
    staticPublishPath: ./Frontend/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        sync: false
      - key: VITE_SITE_ORIGIN
        sync: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      # Only Vite's fingerprinted assets are immutable. Keep HTML revalidated so a
      # returning visitor does not request chunks removed by the next deploy.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /shop
        name: Cache-Control
        value: no-cache
      - path: /shop/*
        name: Cache-Control
        value: no-cache
      - path: /blog/*
        name: Cache-Control
        value: no-cache
      - path: /blog
        name: Cache-Control
        value: no-cache
      - path: /cart
        name: Cache-Control
        value: no-cache
      - path: /contact
        name: Cache-Control
        value: no-cache
    routes:
      - type: redirect
        source: /about
        destination: /blog
      - type: rewrite
        source: /*
        destination: /index.html
