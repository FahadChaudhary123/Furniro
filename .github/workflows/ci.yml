# CI gates — Document B §3, reduced to what this project can actually enforce today.
#
# Doc B specifies seven gates: unit + integration tests, end-to-end purchase journey,
# dependency vulnerability scan, secret scan, bundle-size budget, and accessibility checks.
# Four are implementable now. The other three need a test suite and a purchase path that do
# not exist yet — they get added alongside the thing they test, per
# docs/OPS_CONFORMANCE.md#recommended-reductions.
#
# Doc B: "A red gate blocks merge — no manual overrides without a recorded reason."

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, build, budgets, end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must satisfy Vite 8's engines: ^20.19.0 || >=22.12.0
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            Frontend/package-lock.json
            Backend/package-lock.json

      # Runs before anything installs: it needs only git and the checkout, and it catches a
      # class of failure that is INVISIBLE on Windows and macOS. A case-only rename there
      # succeeds on disk while git keeps tracking the old name, so every local check passes
      # and this Linux runner is the first place the import breaks. Failing here names both
      # spellings; failing in Build says "Could not resolve './pages/Shop'".
      - name: Filename case matches git
        working-directory: .
        run: node scripts/check-filename-case.mjs

      # ci, not install — respects the lockfile exactly and fails if it is out of sync.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Fast, pure-logic checks. They run before the build because a rounding bug should
      # fail in under a second, not after a bundle.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Doc B §12: "Bundle size, image weight and third-party script count are gates,
      # not guidelines."
      - name: Enforce performance budgets
        run: node scripts/check-budgets.mjs

      # CONT-04. Audits the route manifest against App.jsx and the generated sitemap:
      # duplicate titles, orphaned pages, a noindex page advertised for crawling, a sitemap
      # of localhost URLs. Errors fail the build; warnings are reported and do not.
      - name: SEO health check
        run: npm run seo

      # Real browser, real bundle, both servers. Catches what a build cannot: this suite
      # found a React error #31 crash that blanked /shop while lint, build, budgets and the
      # API smoke tests were all green.
      # `--with-deps` switches to root and runs apt-get against the Ubuntu and Google Chrome
      # mirrors. That is the flakiest thing in this workflow and is what failed here: eight
      # seconds of apt output, a non-zero exit, and the browser download never reached.
      #
      # So the apt pass is now a FALLBACK rather than the default. The GitHub Ubuntu runner
      # image already ships the shared libraries Chromium needs — but that is a judgement
      # about someone else's image, so it is checked rather than assumed: if the browser
      # cannot start, the dependencies are installed and it is checked again, failing for
      # real the second time.
      - name: Install Playwright browser
        run: |
          # Written HERE, not in /tmp: node resolves `require` from the script's own
          # directory, so a check outside this package cannot find @playwright/test.
          cat > launch-check.cjs <<'CHECK'
          require('@playwright/test').chromium.launch()
            .then((b) => b.close())
            .then(() => console.log('chromium launches'))
            .catch((e) => {
              console.error('chromium could not launch:', e.message);
              process.exit(1);
            });
          CHECK

          npx playwright install chromium

          if ! node ./launch-check.cjs; then
            echo "::warning::Chromium needs system libraries; falling back to apt."
            npx playwright install-deps chromium
            node ./launch-check.cjs
          fi

          rm -f launch-check.cjs

      # The e2e config starts the API itself (playwright.config.js webServer), so this job
      # needs the API's dependencies as well as the front end's. Without them the run fails
      # with ERR_MODULE_NOT_FOUND: express.
      - name: Install API dependencies (the e2e run starts the API)
        working-directory: Backend
        run: npm ci

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Frontend/playwright-report
          retention-days: 7

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: Frontend/dist
          retention-days: 7

  backend:
    name: Back end — unit, boot and smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      # CAT-04. Exits non-zero if any product fails a blocking publish-gate rule, so a bad
      # catalogue edit fails the build instead of silently shrinking the shop. Doc B §15
      # allows 14 days to resolve; a gate that runs on every push is stricter and cheaper.
      - name: Catalogue completeness
        run: npm run completeness

      # Boots the server and exercises the real HTTP surface: health, correlation, error
      # shape, CORS, and the whole catalogue API contract.
      - name: Smoke test
        run: |
          npm start > /tmp/boot.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health > /dev/null && break
            sleep 1
          done

          # A misconfigured middleware can log a ValidationError and keep serving, so every
          # request-level check still passes. That is how an IPv6 rate-limit bypass reached
          # main: the limiter worked, it just could be walked around. Boot output is a gate.
          echo '--- boot log ---'; cat /tmp/boot.log
          if grep -qiE 'ValidationError|ERR_ERL|DeprecationWarning|Error:' /tmp/boot.log; then
            echo "::error::Server logged an error or warning during startup"
            exit 1
          fi

          npm run smoke
        env:
          PORT: 3000
          NODE_ENV: test

      # NFR-04. Its own server on its own port, with the rate limit raised: the benchmark
      # sends ~2400 requests and would otherwise throttle itself, and the smoke server's
      # limits are left alone so its SEC-03 checks still mean what they say.
      #
      # The absolute budget is 50 ms against a measured ~1.4 ms, so runner noise has 35x of
      # headroom. The scale check is the part that matters and it is a ratio between two
      # measurements on the same machine, so it does not care how fast the runner is.
      - name: API latency benchmark
        run: |
          PORT=3101 RATE_LIMIT_MAX=3000 npm start > /tmp/latency-boot.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3101/health > /dev/null && break
            sleep 1
          done
          BASE_URL=http://localhost:3101 npm run latency
        env:
          NODE_ENV: test

  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [Frontend, Backend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Doc B §10: critical patched in 48h, high in 7 days, medium in 30.
      # The gate blocks on high and critical; medium is reported, not enforced.
      - name: npm audit (high + critical block)
        working-directory: ${{ matrix.package }}
        run: npm audit --audit-level=high

      - name: npm audit (full report, advisory)
        if: always()
        working-directory: ${{ matrix.package }}
        run: npm audit || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the working tree.
          fetch-depth: 0

      # Doc B §2: "Committing a secret is treated as a Sev 2 incident and the secret is
      # rotated, not just removed from history." This gate is what stops it reaching main.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Belt and braces: gitleaks scans content, this catches the file itself being tracked.
      - name: Assert no .env file is tracked
        run: |
          if git ls-files --error-unmatch '**/.env' 2>/dev/null; then
            echo "::error::A .env file is tracked by git. Remove it and ROTATE the credentials."
            echo "See docs/runbooks/secret-rotation.md"
            exit 1
          fi
          echo "No tracked .env files."
